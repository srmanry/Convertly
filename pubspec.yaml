name: convertly
description: "AudioForge is a simple, privacy-focused offline media converter and audio toolkit."
publish_to: 'none'

version: 1.1.1+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Translated interface. The delegates ship with Flutter; intl supplies the
  # date and number formats each locale expects.
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management, dependency injection and routing.
  get: ^4.7.3

  # Key-value persistence for onboarding flag and user settings.
  shared_preferences: ^2.5.5

  # Value equality for domain entities and data models.
  equatable: ^2.1.0

  # Media processing. The original ffmpeg_kit_flutter was retired in 2023;
  # this is the maintained community fork.
  #
  # The audio build, not the full-gpl one. This app only ever encodes MP3, AAC
  # and PCM and only uses filters built into FFmpeg itself, so the video
  # encoders in the full build were tens of megabytes of dead weight in every
  # download. The audio build is also LGPL rather than GPL.
  ffmpeg_kit_flutter_new_audio: ^2.5.7

  # Picking source media from device storage.
  file_picker: ^12.1.1

  # Playback for the built-in audio player.
  just_audio: ^0.10.6

  # Sharing converted output to other apps.
  share_plus: ^13.3.0

  # Resolving app-specific storage directories.
  path_provider: ^2.1.6

  # Local metadata database for the media library.
  sqflite: ^2.4.3
  google_mobile_ads: ^9.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generates the native launch screen from the settings at the bottom of this
  # file. A tool, not a runtime dependency: it writes Android and iOS
  # resources and is then out of the picture.
  flutter_native_splash: ^2.4.8


  # Runs the real SQLite engine on the host, so database behaviour is tested
  # for real instead of against a mock.
  sqflite_common_ffi: ^2.4.2+1

  # Lets a test swap in a fake path_provider, so platform-specific storage
  # behaviour is covered on the host instead of only on a device.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/audio.png

# The screen Android and iOS show while the app process starts, before any
# Dart code runs. Without this it is a white flash, which on a dark app reads
# as a fault. Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  # The top-left colour of the app's own backdrop, so the splash hands over to
  # the first screen without a visible change.
  color: "#100B2B"
  image: assets/logo/splash.png
  android: true
  ios: true
  web: false

  # Android 12 and newer draw the icon themselves, inside a circle, and ignore
  # the image above. They crop anything outside the middle two thirds, which
  # is why this one sits on a larger canvas.
  android_12:
    color: "#100B2B"
    image: assets/logo/splash_android12.png
    icon_background_color: "#100B2B"
